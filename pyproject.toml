[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finkey-memory"
version = "0.1.0"
description = "Four-tier temporal memory for AI agents: volatile working layer, as-of fact store, scene blocks, self-regenerating persona — plus a dream cycle that maintains them."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "FinKey" }]
keywords = ["agent-memory", "llm", "long-term-memory", "temporal", "rag", "persona"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
pg = ["psycopg2-binary>=2.9"]
qdrant = ["qdrant-client>=1.7"]
redis = ["redis>=5"]
test = ["pytest>=8"]
bench = ["matplotlib>=3.8", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/NikitaKoreshkov/FinKeyMemory"
Repository = "https://github.com/NikitaKoreshkov/FinKeyMemory"
Issues = "https://github.com/NikitaKoreshkov/FinKeyMemory/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
